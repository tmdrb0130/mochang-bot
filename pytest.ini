[pytest]
asyncio_mode = auto
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
markers =
    outline: 사업계획 골자(작업 20)를 켠 채로 도는 테스트
    polish: 생성 후처리(작업 22)를 켠 채로 도는 테스트
    refine: refine() 연결(작업 22·27 마무리)을 켠 채로 도는 테스트
    full_stack: 운영 스위치(골자·polish·refine·자동 이어쓰기)를 전부 켠 통합 테스트 (tests/test_hardening.py)
